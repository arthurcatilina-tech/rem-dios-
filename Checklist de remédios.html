<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist de remédios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --ink:#12332F; --muted:#5C7571; --line:#D5E0DC;
  --cap-a:#1F7A6D; --cap-b:#F2A48B; --danger:#B3402A; --focus:#1F7A6D;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C1A; --surface:#15292600; --surface:#162A27; --ink:#E4F0ED; --muted:#8FA9A4; --line:#27403B;
    --cap-a:#4FB5A5; --cap-b:#E58E72; --danger:#F08A73; --focus:#4FB5A5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C1A; --surface:#162A27; --ink:#E4F0ED; --muted:#8FA9A4; --line:#27403B;
  --cap-a:#4FB5A5; --cap-b:#E58E72; --danger:#F08A73; --focus:#4FB5A5; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 16px 96px}
h1{font-size:28px;line-height:1.1;margin:8px 0 4px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bar{flex:1;height:22px;border-radius:999px;background:var(--cap-b);overflow:hidden;position:relative;border:2px solid var(--ink)}
.fill{height:100%;width:0;background:var(--cap-a);transition:width .3s ease}
.count{font-weight:700;white-space:nowrap;font-size:15px}
.add{display:flex;gap:8px;margin-bottom:18px}
.add input{flex:1;min-width:0;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.add input::placeholder{color:var(--muted)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-weight:700}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px 4px 4px 6px}
li .chk{flex:1;display:flex;align-items:center;gap:12px;min-height:48px;background:none;border:0;color:var(--ink);text-align:left;padding:0 6px}
.pill{width:36px;height:18px;border-radius:999px;border:2px solid var(--ink);background:var(--surface);flex:none;position:relative;overflow:hidden;transition:background .2s}
.pill::after{content:"";position:absolute;inset:0 50% 0 0;background:transparent;transition:background .2s}
li.done .pill{background:var(--cap-b)}
li.done .pill::after{background:var(--cap-a)}
li.done .name{text-decoration:line-through;color:var(--muted)}
.name{overflow-wrap:anywhere}
.del{width:48px;height:48px;border:0;background:none;color:var(--muted);border-radius:12px;font-size:22px;flex:none}
.del:active{color:var(--danger)}
.tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.ghost{height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink)}
.empty{text-align:center;padding:28px 8px;color:var(--muted)}
.empty p{margin:0 0 14px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:none;align-items:center;justify-content:space-between;gap:8px}
.toast.show{display:flex}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;height:44px;padding:0 12px;text-decoration:underline}
.last{margin:-6px 0 16px;color:var(--muted);font-size:14px}
.ver{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Checklist de remédios</h1>
  <p class="sub">Adicione, marque e remova remédios da sua lista.</p>

  <div class="progress" aria-live="polite">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <span class="count" id="count">0 de 0</span>
  </div>

  <p class="last" id="ultima"></p>

  <div class="add">
    <input id="novo" type="text" placeholder="Nome do remédio" autocomplete="off" enterkeyhint="done" maxlength="80" aria-label="Nome do remédio">
    <button class="btn" id="addBtn" type="button">Adicionar</button>
  </div>

  <ul id="lista"></ul>

  <div class="empty" id="vazio" hidden>
    <p>Sua lista está vazia. Digite um nome acima ou comece com os remédios com receita mais vendidos no Brasil.</p>
    <button class="ghost" id="starter" type="button">Carregar lista inicial</button>
  </div>

  <div class="tools" id="tools" hidden>
    <button class="ghost" id="desmarcar" type="button">Desmarcar todos</button>
    <button class="ghost" id="limpar" type="button">Remover marcados</button>
  </div>

  <div class="ver">Versão 1.2</div>
</main>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo" type="button">Desfazer</button></div>

<script>
(function(){
  var KEY="checklist-remedios:v1", KEY2="checklist-remedios:ultimo-reset", lastReset=null;
  function fmt(ts){
    var d=new Date(ts), n=new Date();
    var h=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    var dia=new Date(d.getFullYear(),d.getMonth(),d.getDate()), hoje=new Date(n.getFullYear(),n.getMonth(),n.getDate());
    var diff=Math.round((hoje-dia)/86400000);
    if(diff===0) return "hoje às "+h;
    if(diff===1) return "ontem às "+h;
    return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"})+" às "+h;
  }
  var STARTER=["Losartana","Metformina","Sinvastatina","Anlodipino","Hidroclorotiazida","Enalapril","Levotiroxina","Omeprazol","Sertralina","Amoxicilina"];
  var items=[], last=null, timer=null;
  var $=function(id){return document.getElementById(id)};
  var lista=$("lista"), novo=$("novo");

  function load(){
    try{var r=localStorage.getItem(KEY); if(r){var p=JSON.parse(r); if(Array.isArray(p)) items=p;}}catch(e){items=[];}
    try{var t=parseInt(localStorage.getItem(KEY2),10); if(t) lastReset=t;}catch(e){}
  }
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){} }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

  function render(){
    lista.textContent="";
    items.forEach(function(it){
      var li=document.createElement("li"); if(it.done) li.className="done";
      var chk=document.createElement("button"); chk.type="button"; chk.className="chk";
      chk.setAttribute("role","checkbox"); chk.setAttribute("aria-checked",String(!!it.done));
      var pill=document.createElement("span"); pill.className="pill";
      var nm=document.createElement("span"); nm.className="name"; nm.textContent=it.name;
      chk.appendChild(pill); chk.appendChild(nm);
      chk.addEventListener("click",function(){it.done=!it.done; save(); render();});
      var del=document.createElement("button"); del.type="button"; del.className="del";
      del.setAttribute("aria-label","Remover "+it.name); del.textContent="\u00D7";
      del.addEventListener("click",function(){remove(it.id);});
      li.appendChild(chk); li.appendChild(del); lista.appendChild(li);
    });
    var total=items.length, feitos=items.filter(function(i){return i.done}).length;
    $("count").textContent=feitos+" de "+total;
    $("fill").style.width=(total?Math.round(feitos/total*100):0)+"%";
    $("vazio").hidden=total>0;
    $("tools").hidden=total===0;
    $("ultima").textContent=lastReset?"Última vez que desmarcou todos: "+fmt(lastReset):"Você ainda não desmarcou todos.";
  }

  function add(){
    var nome=novo.value.trim().replace(/\s+/g," ");
    if(!nome){novo.focus();return;}
    var dup=items.some(function(i){return i.name.toLowerCase()===nome.toLowerCase()});
    if(dup){toast("\u201C"+nome+"\u201D já está na lista.",false);return;}
    items.unshift({id:uid(),name:nome,done:false});
    novo.value=""; save(); render(); novo.focus();
  }

  function remove(id){
    var idx=items.findIndex(function(i){return i.id===id});
    if(idx<0)return;
    var it=items.splice(idx,1)[0];
    last={list:[{item:it,idx:idx}]};
    save(); render(); toast("\u201C"+it.name+"\u201D removido.",true);
  }

  function toast(msg,canUndo){
    $("toastMsg").textContent=msg; $("undo").style.display=canUndo?"":"none";
    $("toast").classList.add("show");
    clearTimeout(timer); timer=setTimeout(function(){$("toast").classList.remove("show");last=canUndo?last:null;},4500);
  }

  $("undo").addEventListener("click",function(){
    if(!last)return;
    last.list.sort(function(a,b){return a.idx-b.idx}).forEach(function(r){items.splice(Math.min(r.idx,items.length),0,r.item)});
    last=null; save(); render(); $("toast").classList.remove("show");
  });
  $("addBtn").addEventListener("click",add);
  novo.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();add();}});
  $("desmarcar").addEventListener("click",function(){
    items.forEach(function(i){i.done=false});
    lastReset=Date.now();
    try{localStorage.setItem(KEY2,String(lastReset));}catch(e){}
    save(); render();
  });
  $("limpar").addEventListener("click",function(){
    var rem=[]; items.forEach(function(it,idx){if(it.done)rem.push({item:it,idx:idx})});
    if(!rem.length){toast("Nenhum remédio marcado.",false);return;}
    items=items.filter(function(i){return !i.done});
    last={list:rem}; save(); render(); toast(rem.length+" removido(s).",true);
  });
  $("starter").addEventListener("click",function(){
    items=STARTER.map(function(n){return {id:uid(),name:n,done:false}}); save(); render();
  });

  load(); render();
})();
</script>
</body>
</html>
